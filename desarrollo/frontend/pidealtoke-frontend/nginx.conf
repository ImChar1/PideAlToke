server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Si la ruta no existe físicamente, redirige todo a index.html para que Angular tome el control del enrutamiento
        try_files $uri $uri/ /index.html; 
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}