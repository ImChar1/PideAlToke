# En localhost el navegador ya trata http como contexto seguro (MSAL funciona),
# asi que se sirve directo por HTTP. En cualquier otro host (IP publica en AWS)
# se fuerza HTTPS, porque MSAL necesita Web Crypto (solo disponible en contexto seguro).
map $host $forzar_https {
    default      1;
    localhost    0;
    127.0.0.1    0;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        if ($forzar_https) {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
