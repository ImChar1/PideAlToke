<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">P</span>
      <span class="brand-name">PideAlToke</span>
    </div>

    <div class="topbar-actions">
      <a routerLink="/pedidos" class="cart-btn" aria-label="Ver mi pedido">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        @if (cartCount() > 0) {
          <span class="cart-count">{{ cartCount() }}</span>
        }
      </a>

      <div class="user-chip">
        <span class="avatar">{{ iniciales || 'U' }}</span>
        <span class="user-name">{{ userName }}</span>
      </div>

      <button class="btn-logout" (click)="onLogout()">Cerrar Sesión</button>
    </div>
  </header>

  <div class="layout-body">
    <aside class="sidebar">
      <nav>
        <a routerLink="/dashboard" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
            <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
          </svg>
          Dashboard
        </a>
        <a routerLink="/catalogo" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 7H4a1 1 0 0 0-1 1v1.5a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1Z"/>
            <path d="M5 10.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8.5"/><path d="M9.5 14h5"/>
          </svg>
          Catálogo
        </a>
        <a routerLink="/inventario" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 8V21H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/>
          </svg>
          Inventario
        </a>
        <a routerLink="/pedidos" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          Pedidos
          @if (cartCount() > 0) {
            <span class="sidebar-count">{{ cartCount() }}</span>
          }
        </a>
      </nav>
    </aside>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
