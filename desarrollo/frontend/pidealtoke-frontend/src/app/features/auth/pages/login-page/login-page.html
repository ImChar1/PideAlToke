<div class="login-container">
  <div class="login-card">
    <div class="brand-header">
      <h1>PideAlToke</h1>
      <p>Gestión de Pedidos & Logística</p>
    </div>
    
    <div class="login-content">
      <h2>Iniciar Sesión</h2>
      <p class="subtitle">Autentícate con tu cuenta corporativa para ingresar al sistema.</p>
      
      <button class="btn-microsoft" (click)="onLogin()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 23 23">
          <path fill="#f35325" d="M1 1h10v10H1z"/>
          <path fill="#81bc06" d="M12 1h10v10H12z"/>
          <path fill="#05a6f0" d="M1 12h10v10H1z"/>
          <path fill="#ffba08" d="M12 12h10v10H12z"/>
        </svg>
        <span>Continuar con Microsoft</span>
      </button>

      <div class="auth-footer">
        <span>¿No tienes una cuenta?</span>
        <a routerLink="/register" class="link-auth">Regístrate</a>
      </div>
    </div>
  </div>
</div>
