# Variables de conexion a RabbitMQ compartidas por ms-pedidos (productor), ms-inventario (consumidor)
# y ms-mensajeria (administrador). Se inyectan con `<<: *rabbitmq-env` en cada servicio.
# Los nombres de exchanges/colas NO van aqui: viven en el config.py de cada servicio.
# El broker de RabbitMQ (cluster de 2 nodos) y el cluster de Kafka NO viven en este archivo: se levantan
# con docker-compose.rabbitmq.yml / docker-compose.kafka.yml / docker-compose.kafka-ui.yml y se comunican
# con estos servicios por la red externa `pidealtoke-net` (ver README, o simplemente ./levantar-todo.sh).
# Los microservicios reintentan la conexion, asi que el orden de arranque no es critico.
#
# Variables de conexion a RabbitMQ compartidas por ms-pedidos (productor), ms-inventario (productor de
# alertas y consumidor), ms-notificaciones (consumidor) y ms-mensajeria (administrador).
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_ENABLED: "true"
  RABBITMQ_HOST: rabbitmq          # nodo 1 del cluster (alias en la red pidealtoke-net)
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-admin}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}

# Conexion a Kafka: listeners INTERNAL de los 3 brokers (basta con que viva uno para descubrir el resto).
x-kafka-env: &kafka-env
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092

services:
  db:
    image: mariadb:11.2
    container_name: pidealtoke-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME_USUARIOS}
      # Contrasenas de los usuarios por microservicio (las consume init-db/init-03-users.sh)
      DB_PASS_USUARIOS: ${DB_PASS_USUARIOS:?Falta DB_PASS_USUARIOS en .env}
      DB_PASS_CATALOGO: ${DB_PASS_CATALOGO:?Falta DB_PASS_CATALOGO en .env}
      DB_PASS_INVENTARIO: ${DB_PASS_INVENTARIO:?Falta DB_PASS_INVENTARIO en .env}
      DB_PASS_PEDIDOS: ${DB_PASS_PEDIDOS:?Falta DB_PASS_PEDIDOS en .env}
    ports:
      - "${PORT_DB}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  ms-usuarios:
    build: ./backend/ms-usuarios
    container_name: ms-usuarios
    ports:
      - "${PORT_MS_USUARIOS}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://svc_usuarios:${DB_PASS_USUARIOS}@${DB_HOST}:${DB_PORT}/${DB_NAME_USUARIOS}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
    depends_on:
      db:
        condition: service_healthy

  ms-catalogo:
    build: ./backend/ms-catalogo
    container_name: ms-catalogo
    ports:
      - "${PORT_MS_CATALOGO}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://svc_catalogo:${DB_PASS_CATALOGO}@${DB_HOST}:${DB_PORT}/${DB_NAME_CATALOGO}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
    depends_on:
      db:
        condition: service_healthy

  ms-inventario:
    build: ./backend/ms-inventario
    container_name: ms-inventario
    ports:
      - "${PORT_MS_INVENTARIO}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://svc_inventario:${DB_PASS_INVENTARIO}@${DB_HOST}:${DB_PORT}/${DB_NAME_INVENTARIO}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      <<: [*rabbitmq-env, *kafka-env]
    depends_on:
      db:
        condition: service_healthy
      # Publica alertas en `pidealtoke.alertas`; la cola `alertas.stock` la declara ms-notificaciones.
      ms-notificaciones:
        condition: service_started

  ms-pedidos:
    build: ./backend/ms-pedidos
    container_name: ms-pedidos
    ports:
      - "${PORT_MS_PEDIDOS}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://svc_pedidos:${DB_PASS_PEDIDOS}@${DB_HOST}:${DB_PORT}/${DB_NAME_PEDIDOS}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      INVENTARIO_SERVICE_URL: http://ms-inventario:8000
      CATALOGO_SERVICE_URL: http://ms-catalogo:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      <<: [*rabbitmq-env, *kafka-env]
    depends_on:
      db:
        condition: service_healthy
      ms-inventario:
        condition: service_started
      ms-catalogo:
        condition: service_started

  # Administrador de RabbitMQ (colas, exchanges, bindings). Protegido con JWT + rol ADMIN.
  # No se enruta por el gateway local a proposito: es de uso operativo, no de la app.
  ms-mensajeria:
    build: ./backend/ms-mensajeria
    container_name: ms-mensajeria
    ports:
      - "${PORT_MS_MENSAJERIA:-8005}:8000"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      <<: *rabbitmq-env

  # Administrador de Kafka (topicos, configuraciones, consumer groups y lag). JWT + rol ADMIN.
  # Igual que ms-mensajeria: uso operativo, NO se enruta por el gateway.
  ms-kafka-admin:
    build: ./backend/ms-kafka-admin
    container_name: ms-kafka-admin
    ports:
      - "${PORT_MS_KAFKA_ADMIN:-8006}:8000"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092

  # Analitica en tiempo real: CONSUME pedidos.eventos y inventario.movimientos de Kafka
  # (dos consumer groups: analitica-ventas y alertas-stock). Estado en memoria, reconstruido desde el log.
  ms-analitica:
    build: ./backend/ms-analitica
    container_name: ms-analitica
    ports:
      - "${PORT_MS_ANALITICA:-8007}:8000"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      <<: *kafka-env

  # Notificaciones: CONSUME 2 colas de RabbitMQ (notificaciones.pedidos y alertas.stock), cada una con su DLQ.
  ms-notificaciones:
    build: ./backend/ms-notificaciones
    container_name: ms-notificaciones
    ports:
      - "${PORT_MS_NOTIFICACIONES:-8008}:8000"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      <<: *rabbitmq-env

  gateway:
    image: nginx:alpine
    container_name: pidealtoke-gateway
    ports:
      - "${PORT_GATEWAY}:80"
    volumes:
      - ./infra/local-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ms-usuarios
      - ms-catalogo
      - ms-inventario
      - ms-pedidos
      - ms-analitica
      - ms-notificaciones

  frontend:
    build:
      context: ./frontend/pidealtoke-frontend
      args:
        API_GATEWAY_URL: http://localhost:${PORT_GATEWAY}
    container_name: app-frontend
    ports:
      - "${PORT_FRONTEND}:80"
    depends_on:
      - gateway

volumes:
  mariadb_data:

# Red compartida con docker-compose.rabbitmq.yml / .kafka.yml / .kafka-ui.yml. Se crea UNA vez:
#   docker network create pidealtoke-net      (levantar-todo.sh lo hace solo)
networks:
  default:
    name: pidealtoke-net
    external: true