# Arquitectura Kafka: 3 nodos Zookeeper (ensemble con quorum) + 3 brokers.
#
#   docker network create pidealtoke-net          (una sola vez; lo comparten todos los compose)
#   docker compose -f docker-compose.kafka.yml up -d
#
# Por que 3 y 3:
#  - Zookeeper guarda el estado del cluster (brokers vivos, lider de cada particion, configuracion).
#    Un ensemble necesita MAYORIA (quorum) para operar: con 3 nodos tolera la caida de 1.
#  - Con 3 brokers y replication.factor=3 cada particion tiene copia en los 3. Con
#    min.insync.replicas=2 y acks=all el productor sigue escribiendo si cae 1 broker (quedan 2 en
#    sincronia) y se pierde 0 mensajes confirmados. Si caen 2, las escrituras se rechazan (consistencia).
#  - `kafka-init` crea los 2 topicos de la solucion (3 particiones, 3 replicas). Tambien se pueden
#    crear/modificar con ms-kafka-admin o desde Kafka-UI; auto.create.topics esta apagado a proposito
#    para que un typo en un nombre no cree topicos fantasma.
#
# Dos listeners por broker:
#   INTERNAL (kafkaN:29092)  -> entre contenedores (microservicios, Kafka-UI, replicacion entre brokers)
#   EXTERNAL (HOST:909N)     -> desde fuera de Docker (tu maquina, o la IP publica en EC2).
#                               Define KAFKA_EXTERNAL_HOST con ese host/IP (por defecto localhost).

x-zookeeper-comun: &zookeeper-comun
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 10
  ZOOKEEPER_SYNC_LIMIT: 5
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_HEAP_OPTS: -Xmx256m -Xms256m

x-kafka-comun: &kafka-comun
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 40s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Defaults del cluster pensados para 3 brokers: todo replicado 3 veces, 2 ISR minimas.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"    # nunca elegir lider una replica desactualizada
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
  KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.producer.async.DefaultEventHandler=WARN,state.change.logger=WARN"

services:
  zookeeper1:
    <<: *zookeeper-comun
    container_name: pidealtoke-zk1
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes: [zk1_data:/var/lib/zookeeper/data, zk1_log:/var/lib/zookeeper/log]

  zookeeper2:
    <<: *zookeeper-comun
    container_name: pidealtoke-zk2
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes: [zk2_data:/var/lib/zookeeper/data, zk2_log:/var/lib/zookeeper/log]

  zookeeper3:
    <<: *zookeeper-comun
    container_name: pidealtoke-zk3
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes: [zk3_data:/var/lib/zookeeper/data, zk3_log:/var/lib/zookeeper/log]

  kafka1:
    <<: *kafka-comun
    container_name: pidealtoke-kafka1
    hostname: kafka1
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "${KAFKA_BIND:-127.0.0.1}:9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes: [kafka1_data:/var/lib/kafka/data]

  kafka2:
    <<: *kafka-comun
    container_name: pidealtoke-kafka2
    hostname: kafka2
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "${KAFKA_BIND:-127.0.0.1}:9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
    volumes: [kafka2_data:/var/lib/kafka/data]

  kafka3:
    <<: *kafka-comun
    container_name: pidealtoke-kafka3
    hostname: kafka3
    depends_on: [zookeeper1, zookeeper2, zookeeper3]
    ports:
      - "${KAFKA_BIND:-127.0.0.1}:9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
    volumes: [kafka3_data:/var/lib/kafka/data]

  # One-shot: crea los 2 topicos (idempotente: --if-not-exists). Config distinta por flujo de datos:
  #  - pedidos.eventos        retencion 30 dias: historial de negocio (ventas) que ms-analitica puede releer.
  #  - inventario.movimientos retencion  7 dias: dato operativo de alto volumen, util solo a corto plazo.
  # Ambos: cleanup.policy=delete (se necesita el historial; compact dejaria solo el ultimo mensaje por key),
  # min.insync.replicas=2 (tolera 1 broker caido sin perder mensajes confirmados).
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pidealtoke-kafka-init
    restart: "no"
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        BS=kafka1:29092,kafka2:29092,kafka3:29092
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic pedidos.eventos \
          --partitions 3 --replication-factor 3 \
          --config retention.ms=2592000000 --config cleanup.policy=delete --config min.insync.replicas=2
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic inventario.movimientos \
          --partitions 3 --replication-factor 3 \
          --config retention.ms=604800000 --config cleanup.policy=delete --config min.insync.replicas=2
        kafka-topics --bootstrap-server $$BS --describe --topic pedidos.eventos
        kafka-topics --bootstrap-server $$BS --describe --topic inventario.movimientos

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:

networks:
  default:
    name: pidealtoke-net
    external: true
