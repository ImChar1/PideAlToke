# Clustering por lista fija de nodos (classic_config). Ambos nodos montan ESTE mismo archivo:
# al arrancar, cada uno intenta unirse a los demas de la lista; el que llega primero queda solo
# y el otro se le une. Los nombres rabbit@rabbit1 / rabbit@rabbit2 son el hostname de cada
# contenedor (ver docker-compose.rabbitmq.yml), que debe resolver dentro de la red de compose.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
cluster_formation.discovery_retry_limit = 20
cluster_formation.discovery_retry_interval = 1000

# Si un nodo se cae y el otro sigue vivo, el cluster sigue atendiendo (modo "ignore": con 2 nodos no
# hay quorum posible para elegir un lado ante una particion de red; para este proyecto se prioriza
# disponibilidad. En produccion se usarian 3 nodos y pause_minority).
cluster_partition_handling = ignore
