server {
    listen 80;

    location /api/v1/users/ {
        proxy_pass http://ms-usuarios:8000/api/v1/users/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/productos/ {
        proxy_pass http://ms-catalogo:8000/api/v1/productos/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/productos {
        proxy_pass http://ms-catalogo:8000/api/v1/productos;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }

    # Movimientos de stock de uso INTERNO (solo ms-pedidos, por la red de Docker):
    # no se exponen al exterior. Una location con regex gana sobre las de prefijo.
    location ~ ^/api/v1/inventario/[^/]+/(reservar|liberar|confirmar-salida)/?$ {
        return 403;
    }

    location /api/v1/inventario/ {
        proxy_pass http://ms-inventario:8000/api/v1/inventario/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/inventario {
        proxy_pass http://ms-inventario:8000/api/v1/inventario;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/pedidos/ {
        proxy_pass http://ms-pedidos:8000/api/v1/pedidos/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/v1/pedidos {
        proxy_pass http://ms-pedidos:8000/api/v1/pedidos;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }
}