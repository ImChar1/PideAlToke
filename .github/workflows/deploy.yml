name: Deploy Infrastructure and Applications to AWS

on:
  push:
    branches: [ "release/1.0" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      # --- ETAPA 1: REDES E INFRAESTRUCTURA BASE ---
      - name: Aplicar Terraform Etapa 1
        working-directory: desarrollo/infra/terraform_aws/etapa_1
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_azure_tenant_name: ${{ secrets.AZURE_TENANT_NAME }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_ecr_frontend_repo: ${{ secrets.ECR_FRONTEND_REPO }}
          TF_VAR_ecr_backend_repo: ${{ secrets.ECR_BACKEND_REPO }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "VPC_ID=$(terraform output -raw vpc_id)" >> $GITHUB_ENV
          echo "PUBLIC_SUBNET_ID=$(terraform output -raw public_subnet_id)" >> $GITHUB_ENV
          echo "PRIVATE_SUBNET_ID=$(terraform output -raw private_subnet_id)" >> $GITHUB_ENV

      - name: Limpiar Etapa 1 si falla
        if: failure()
        working-directory: desarrollo/infra/terraform_aws/etapa_1
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_azure_tenant_name: ${{ secrets.AZURE_TENANT_NAME }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_ecr_frontend_repo: ${{ secrets.ECR_FRONTEND_REPO }}
          TF_VAR_ecr_backend_repo: ${{ secrets.ECR_BACKEND_REPO }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
        run: terraform destroy -auto-approve

      # --- ETAPA 2: SERVICIOS Y CÓMPUTO ---
      - name: Aplicar Terraform Etapa 2
        working-directory: desarrollo/infra/terraform_aws/etapa_2
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_azure_tenant_name: ${{ secrets.AZURE_TENANT_NAME }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_ecr_frontend_repo: ${{ secrets.ECR_FRONTEND_REPO }}
          TF_VAR_ecr_backend_repo: ${{ secrets.ECR_BACKEND_REPO }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "API_GATEWAY_ENDPOINT=$(terraform output -raw api_gateway_endpoint)" >> $GITHUB_ENV
          echo "FRONTEND_PUBLIC_IP=$(terraform output -raw frontend_public_ip)" >> $GITHUB_ENV

      - name: Limpiar Etapa 2 si falla
        if: failure()
        working-directory: desarrollo/infra/terraform_aws/etapa_2
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_vpc_id: ${{ env.VPC_ID }}
          TF_VAR_public_subnet_id: ${{ env.PUBLIC_SUBNET_ID }}
          TF_VAR_private_subnet_id: ${{ env.PRIVATE_SUBNET_ID }}
          TF_VAR_azure_tenant_name: ${{ secrets.AZURE_TENANT_NAME }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_ecr_frontend_repo: ${{ secrets.ECR_FRONTEND_REPO }}
          TF_VAR_ecr_backend_repo: ${{ secrets.ECR_BACKEND_REPO }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
        run: terraform destroy -auto-approve

      # --- CONSTRUCCIÓN Y DESPLIEGUE DOCKER ---
      - name: Autenticar en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Crear Repositorios ECR si no existen
        run: |
          aws ecr describe-repositories --repository-names ${{ secrets.ECR_BACKEND_REPO }} || aws ecr create-repository --repository-name ${{ secrets.ECR_BACKEND_REPO }}
          aws ecr describe-repositories --repository-names ${{ secrets.ECR_FRONTEND_REPO }} || aws ecr create-repository --repository-name ${{ secrets.ECR_FRONTEND_REPO }}

      - name: Subir Microservicios Backend a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_BACKEND_REPO }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:ms-usuarios ./desarrollo/backend/ms-usuarios
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:ms-usuarios

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:ms-catalogo ./desarrollo/backend/ms-catalogo
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:ms-catalogo

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:ms-inventario ./desarrollo/backend/ms-inventario
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:ms-inventario

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:ms-pedidos ./desarrollo/backend/ms-pedidos
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:ms-pedidos

      - name: Subir Frontend a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build --build-arg API_GATEWAY_URL=${{ env.API_GATEWAY_ENDPOINT }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./desarrollo/frontend/pidealtoke-frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Esperar a que las instancias estén listas para SSM
        run: |
          echo "Esperando a que frontend-ec2 y backend-ec2 pasen su chequeo de estado..."
          FRONTEND_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=frontend-ec2" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          BACKEND_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=backend-ec2" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          aws ec2 wait instance-status-ok --instance-ids "$FRONTEND_ID" "$BACKEND_ID"

      - name: Reiniciar Contenedores en EC2
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=frontend-ec2" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:latest",
              "docker stop frontend-container || true",
              "docker rm frontend-container || true",
              "docker run -d -p 80:80 --name frontend-container ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:latest"
            ]'

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=backend-ec2" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com",
              "cd /home/ec2-user",
              "cat <<EOF > .env",
              "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}",
              "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}",
              "DB_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}",
              "DB_HOST=db",
              "DB_PORT=3306",
              "DB_NAME_USUARIOS=${{ secrets.DB_NAME_USUARIOS }}",
              "DB_NAME_CATALOGO=${{ secrets.DB_NAME_CATALOGO }}",
              "DB_NAME_INVENTARIO=${{ secrets.DB_NAME_INVENTARIO }}",
              "DB_NAME_PEDIDOS=${{ secrets.DB_NAME_PEDIDOS }}",
              "PORT_DB=3306",
              "PORT_MS_USUARIOS=8001",
              "PORT_MS_CATALOGO=8002",
              "PORT_MS_INVENTARIO=8003",
              "PORT_MS_PEDIDOS=8004",
              "PORT_GATEWAY=8080",
              "PORT_FRONTEND=4200",
              "EOF",
              "docker compose pull",
              "docker compose up -d"
            ]'

      - name: Resumen del Despliegue
        run: |
          echo "### 🚀 ¡Despliegue Integrado Exitoso!" >> $GITHUB_STEP_SUMMARY
          echo "**🌐 Enlace Frontend:** http://${{ env.FRONTEND_PUBLIC_IP }}" >> $GITHUB_STEP_SUMMARY
          echo "**🔗 API Gateway Endpoint:** ${{ env.API_GATEWAY_ENDPOINT }}" >> $GITHUB_STEP_SUMMARY